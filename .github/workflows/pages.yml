name: pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build interactive gallery
        run: mkdir -p _pages && cargo run --example basic > _pages/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _pages
      - id: deployment
        uses: actions/deploy-pages@v5
